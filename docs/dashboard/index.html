<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0d12"/>
<title>Living Icon · Stall Soft-PASS</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #141821;
    --line: #243044;
    --text: #e8eef8;
    --muted: #8b9bb4;
    --cyan: #3de0ff;
    --violet: #a78bfa;
    --ok: #34d399;
    --warn: #fbbf24;
    --fail: #f87171;
    --pad: clamp(0.75rem, 3.5vw, 1.5rem);
    --gap: clamp(0.6rem, 2.5vw, 1rem);
    --avatar: clamp(56px, 18vw, 80px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(900px 480px at 0% 0%, #1a1030 0%, transparent 55%),
                radial-gradient(700px 400px at 100% 0%, #0a2a33 0%, transparent 50%), var(--bg);
    color: var(--text); min-height: 100dvh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: calc(0.65rem + env(safe-area-inset-top)) var(--pad) 0.65rem;
    border-bottom: 1px solid var(--line);
    background: rgba(11,13,18,0.92);
    backdrop-filter: blur(10px);
  }
  h1 { margin: 0; font-size: clamp(0.95rem, 4.2vw, 1.2rem); line-height: 1.25; }
  h1 span { color: var(--cyan); }
  .meta { color: var(--muted); font-size: clamp(0.7rem, 3.2vw, 0.85rem); margin-top: 0.25rem; word-break: break-word; }
  .toolbar { margin-top: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  button, .chip {
    min-height: 40px; touch-action: manipulation;
    background: #1c2433; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.45rem 0.75rem; cursor: pointer;
    font-size: clamp(0.75rem, 3.3vw, 0.85rem);
  }
  button:hover, .chip:hover { border-color: var(--cyan); }
  .chip.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
  main { padding: var(--gap) var(--pad) calc(2rem + env(safe-area-inset-bottom)); }
  .legend { font-size: clamp(0.68rem, 3vw, 0.78rem); color: var(--muted); margin-bottom: 0.65rem; line-height: 1.35; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: var(--gap); }
  .grid {
    display: grid; gap: var(--gap);
    grid-template-columns: 1fr;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 960px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (min-width: 1280px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: clamp(0.75rem, 3vw, 0.95rem);
    display: flex; flex-direction: column; gap: 0.55rem;
  }
  .card.stall { border-color: #7f1d1d; box-shadow: 0 0 0 1px rgba(248,113,113,0.15); }
  .card.fresh { border-color: #065f46; }
  .top { display: flex; gap: 0.75rem; align-items: center; min-width: 0; }
  .avatar {
    width: var(--avatar); height: var(--avatar); flex: 0 0 var(--avatar);
    border-radius: 12px; background: #0a0c10; border: 1px solid var(--line);
    object-fit: contain; image-rendering: pixelated;
  }
  .iconwrap { position: relative; width: var(--avatar); height: var(--avatar); flex: 0 0 var(--avatar); }
  /* OK-request overlay (Da Vinci OVERLAY-SPEC r2): full-canvas PNG frame, badge pre-placed top-right
     (center 83%/17%, r 13%). Order: plate -> Living Icon -> badge -> chrome. */
  .okbadge { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; border-radius: 12px; }
  .okbadge[hidden] { display: none; }
  .avatar.missing {
    display: grid; place-items: center; color: var(--muted);
    font-size: 0.65rem; text-align: center; padding: 0.25rem;
  }
  .name { font-weight: 650; font-size: clamp(0.95rem, 4vw, 1.05rem); }
  .title { color: var(--muted); font-size: clamp(0.68rem, 3vw, 0.78rem); overflow-wrap: anywhere; }
  .flags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
  .flag {
    display: inline-block; font-size: clamp(0.62rem, 2.8vw, 0.7rem); font-weight: 600;
    padding: 0.18rem 0.45rem; border-radius: 6px;
  }
  .flag.ok { background: rgba(52,211,153,0.15); color: var(--ok); }
  .flag.warn { background: rgba(251,191,36,0.15); color: var(--warn); }
  .flag.fail { background: rgba(248,113,113,0.15); color: var(--fail); }
  dl {
    margin: 0; display: grid;
    grid-template-columns: minmax(5.5rem, 32%) 1fr;
    gap: 0.28rem 0.45rem;
    font-size: clamp(0.7rem, 3.1vw, 0.78rem);
  }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
  .path { color: var(--violet); }
  footer {
    padding: 0 var(--pad) calc(1.25rem + env(safe-area-inset-bottom));
    color: var(--muted); font-size: clamp(0.68rem, 3vw, 0.75rem); line-height: 1.4;
  }
  code { font-size: 0.92em; }
</style>
</head>
<body>
<header>
  <h1>Living Icon · <span>Stall Soft-PASS</span></h1>
  <div class="meta" id="generated">Loading…</div>
  <div class="meta" id="openasks"></div>
  <div class="toolbar">
    <button type="button" id="reload">Reload</button>
  </div>
</header>
<main>
  <div class="legend">Mobile Soft-PASS · stuck lamp from feed.json (rebuilt from box files every refresh) · no invented mood scores</div>
  <div class="filters">
    <button type="button" class="chip on" data-filter="all">All</button>
    <button type="button" class="chip" data-filter="fleet">Fleet</button>
    <button type="button" class="chip" data-filter="stall">Stalls</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <div id="hostnote"></div>
  Ada Soft-PASS UI · refresh <code>python3 docs/dashboard/refresh_data.py</code>
</footer>
<script>
let DATA = null, FEED = null, filter = 'all';
// Roster/slugs come from data.json (built from docs/status/mood-sources.json); no name list here.
function flagClass(f){ if(!f) return 'fail'; if(f.includes('fresh')) return 'ok'; if(f.includes('aging')) return 'warn'; return 'fail'; }
function cardClass(r,f){ if(f&&f.stuck_softfail) return 'stall'; const s=r.stall_flag||''; if(s.includes('fresh')) return 'fresh'; if(s.includes('stall')||s.includes('no avatar')) return 'stall'; return ''; }
function fmtStuck(sec){ if(sec==null) return '—'; const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60); return h+'h '+m+'m'; }
function feedFor(r){ if(!FEED||!FEED.agents) return null; const slug=r.slug; return FEED.agents.find(a=>a.agent===slug)||null; }
function render(){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  let rows=DATA.roster||[];
  if(filter==='fleet') rows=rows.filter(r=>r.in_fleet);
  if(filter==='stall') rows=rows.filter(r=>{ const f=feedFor(r); return (f&&f.stuck_softfail)||(r.stall_flag||'').includes('Soft-FAIL'); });
  for(const r of rows){
    const f=feedFor(r); const el=document.createElement('article'); el.className='card '+cardClass(r,f);
    const slug=r.slug;
    const img=r.live_art?('../../'+r.live_art):null;
    const growth=r.growth||{};
    let growthLine;
    if(f&&f.growth&&f.growth.source==='personality.json'&&f.growth.mood_scores&&Object.keys(f.growth.mood_scores).length)
      growthLine='Soft-PASS personality.json (feed)';
    else if(growth.status==='Soft-PASS'&&growth.traits)
      growthLine='Soft-PASS personality.json · '+growth.age_hours+'h · drift '+(growth.drift_enabled?'on':'off');
    else growthLine=(f&&f.growth&&f.growth.source==='unreported')?'Soft-FAIL unreported (no invented scores)':((growth.status||'Soft-FAIL')+(growth.note?' — '+growth.note:''));
    const lamp=f?(f.stuck_softfail?'<span class="flag fail">Soft-FAIL stuck</span>':'<span class="flag ok">Soft-PASS GIF</span>'):'<span class="flag warn">no feed</span>';
    el.innerHTML=`<div class="top"><div class="iconwrap">${img?`<img class="avatar" src="${img}" alt="${r.name}" data-live="${slug}"/>`:`<div class="avatar missing">no Soft-PASS</div>`}<img class="okbadge" data-ok="${slug}" alt="" hidden/></div><div><div class="name">${r.name}</div><div class="title">${r.title||r.package||'no pack'}</div><div class="flags"><span class="flag ${flagClass(r.stall_flag)}">${r.stall_flag||'Soft-FAIL'}</span>${lamp}</div></div></div>
    <dl>
      <dt>mood</dt><dd data-live-state="${slug}">${r.mood||(f&&f.mood)||'unreported'}</dd>
      <dt>stuck</dt><dd>${f?fmtStuck(f.stuck_seconds):'—'}</dd>
      <dt>gif_mtime</dt><dd>${(f&&f.gif_mtime)||'—'}</dd>
      <dt>md5</dt><dd>${f&&f.gif_md5?f.gif_md5.slice(0,12)+'…':'—'}</dd>
      <dt>active</dt><dd class="path">${r.active_animation||r.softpass_path||'—'}</dd>
      <dt>growth</dt><dd>${growthLine}</dd>
    </dl>`;
    grid.appendChild(el);
  }
}
async function load(){
  const [dRes,fRes]=await Promise.all([fetch('data.json?ts='+Date.now()), fetch('../status/feed.json?ts='+Date.now())]);
  DATA=await dRes.json();
  try{ MAP=await (await fetch('../status/mood-sources.json?ts='+Date.now())).json(); }catch(e){}
  try{ FEED=await fRes.json(); }catch(e){ FEED=null; }
  document.getElementById('generated').textContent='Soft-PASS '+new Date(DATA.generated_at).toLocaleString()+' · '+(DATA.roster||[]).length+' agents'+(FEED?' · feed '+FEED.updated_at:' · Soft-FAIL feed');
  document.getElementById('hostnote').textContent=FEED&&FEED.host&&FEED.host.url_softfail?FEED.host.url_softfail:'Soft-PASS phone view';
  render();
}

// Live state poll — box-local only. Each bot's docs/status/live/<slug>.json (mirror of its own box file,
// per docs/status/mood-sources.json). Art comes from data.json art_inventory under the bot's art_dir.
const LIVE={}; let MAP=null;
const FLAT_ART={'launch-dnd':'launch-DND'};
function cfgOf(s){ return (MAP&&MAP.agents&&MAP.agents[s])||{}; }
function defMood(s){ return cfgOf(s).stateModel==='flat'?'idle':'calm'; }
function liveMood(s,rec){ if(!rec) return null; const c=cfgOf(s);
  let m=(rec.hold_until&&Date.parse(rec.hold_until)<=Date.now())?(rec.revert_to||defMood(s)):rec.mood;
  if(c.flat_map&&c.flat_map[m]) m=c.flat_map[m];
  const allowed=c.stateModel==='flat'?(MAP.flat_moods||[]):(MAP.matrix_moods||[]);
  return allowed.includes(m)?m:defMood(s); }
function rowOf(s){ return ((DATA&&DATA.roster)||[]).find(r=>r.slug===s)||null; }
function artFor(s,m,v){ const r=rowOf(s), c=cfgOf(s); if(!r||!c.art_dir) return null;
  const inv=new Set(r.art_inventory||[]), d=c.art_dir, dm=defMood(s), ex=['.gif','.png'];
  const tries=[];
  if(c.stateModel==='flat'){ for(const mm of [m,dm]) for(const e of ex) tries.push(d+'/states/'+(FLAT_ART[mm]||mm)+e); }
  else for(const [mm,vv] of [[m,v],[m,'idle'],[dm,v],[dm,'idle']]) for(const e of ex){ tries.push(d+'/matrix/'+vv+'/'+mm+e); tries.push(d+'/matrix/'+mm+'-'+vv+e); }
  const hit=tries.find(t=>inv.has(t)); return hit?'../../'+hit:null; }
// OK-request badge: own 20 fps clock, independent of the mood loop. pending/urgent loop 40 frames;
// approved plays 20 frames once, then the overlay is removed (state shown once per ask_id).
const OK_DIR='../../packages/_overlay/ok-request/128/', OK_FRAMES={pending:40,urgent:40,approved:20}, OK_ST={}, OK_DONE=new Set();
function okState(s,rec){ const o=rec&&rec.ok_request; if(!o||!o.state||o.state==='none') return null;
  if(o.state==='approved'&&OK_DONE.has(o.ask_id)) return null; return o; }
function badge(s,rec){ const o=okState(s,rec), cur=OK_ST[s];
  if(!o){ delete OK_ST[s]; document.querySelectorAll('img[data-ok="'+s+'"]').forEach(el=>el.hidden=true); return; }
  if(!cur||cur.state!==o.state||cur.ask_id!==o.ask_id) OK_ST[s]={state:o.state,ask_id:o.ask_id,f:0,title:o.ask_id+' since '+(o.since||'?')+(o.priority?' · priority':'')}; }
setInterval(()=>{ for(const [s,st] of Object.entries(OK_ST)){
    const n=OK_FRAMES[st.state]; if(st.f>=n){ if(st.state==='approved'){ OK_DONE.add(st.ask_id); delete OK_ST[s];
        document.querySelectorAll('img[data-ok="'+s+'"]').forEach(el=>el.hidden=true); continue; } st.f=0; }
    const src=OK_DIR+st.state+'/frame-'+String(st.f).padStart(2,'0')+'.png'; st.f++;
    document.querySelectorAll('img[data-ok="'+s+'"]').forEach(el=>{ el.src=src; el.title=st.title; el.hidden=false; }); } },50);
async function pollLive(){
  if(!MAP) return;
  for(const s of Object.keys(MAP.agents)){
    try{ const r=await fetch('../status/live/'+s+'.json?ts='+Date.now()); if(!r.ok) continue; LIVE[s]=await r.json(); }catch(e){ continue; }
    const m=liveMood(s,LIVE[s]); badge(s,LIVE[s]);
    const src=artFor(s,m,(LIVE[s].voice_state)||'idle');
    if(src) document.querySelectorAll('img[data-live="'+s+'"]').forEach(img=>{ if(img.getAttribute('src')!==src) img.setAttribute('src',src); img.title=s+': '+m; });
    document.querySelectorAll('[data-live-state="'+s+'"]').forEach(el=>el.textContent=m);
  }
  const n=document.getElementById('openasks'); if(n) n.textContent=(DATA&&DATA.open_asks!=null)?('Open OK asks: '+DATA.open_asks):'';
}
setInterval(()=>load().then(pollLive).catch(()=>{}),60000);   // reload data.json every 60 s
setInterval(pollLive,3000);
document.getElementById('reload').onclick=()=>load();
document.querySelectorAll('.chip').forEach(chip=>{ chip.onclick=()=>{ document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); chip.classList.add('on'); filter=chip.dataset.filter; render(); }; });
load().then(pollLive).catch(e=>{ document.getElementById('generated').textContent='Soft-FAIL load — '+e; });
</script>
</body>
</html>
