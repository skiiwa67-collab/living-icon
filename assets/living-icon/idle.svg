<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Helios idle">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#E07800"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#FFB020" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <style>
      .spin { transform-origin: 64px 64px; animation: spin 12s linear infinite; }
      .pulse { transform-origin: 64px 64px; animation: pulse 3.2s ease-in-out infinite; }
      .blink { animation: blink 4.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%,100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes blink {
        0%, 88%, 100% { transform: scaleY(1); }
        92% { transform: scaleY(0.12); }
      }
    </style>
  </defs>
  <circle class="pulse" cx="64" cy="64" r="58" fill="url(#glow)"/>
  <g class="spin">
    <!-- soft flares -->
    <g fill="#FFB020" opacity="0.55">
      <ellipse cx="64" cy="14" rx="5" ry="10"/>
      <ellipse cx="64" cy="114" rx="5" ry="10"/>
      <ellipse cx="14" cy="64" rx="10" ry="5"/>
      <ellipse cx="114" cy="64" rx="10" ry="5"/>
      <ellipse cx="28" cy="28" rx="4" ry="9" transform="rotate(-45 28 28)"/>
      <ellipse cx="100" cy="100" rx="4" ry="9" transform="rotate(-45 100 100)"/>
      <ellipse cx="100" cy="28" rx="4" ry="9" transform="rotate(45 100 28)"/>
      <ellipse cx="28" cy="100" rx="4" ry="9" transform="rotate(45 28 100)"/>
    </g>
  </g>
  <circle cx="64" cy="64" r="34" fill="url(#core)"/>
  <!-- eyes -->
  <g fill="#1A1208">
    <g class="blink" style="transform-origin: 52px 60px">
      <ellipse cx="52" cy="60" rx="7" ry="8"/>
      <circle cx="54" cy="58" r="2.2" fill="#FFF6D6"/>
    </g>
    <g class="blink" style="transform-origin: 76px 60px; animation-delay: 0.08s">
      <ellipse cx="76" cy="60" rx="7" ry="8"/>
      <circle cx="78" cy="58" r="2.2" fill="#FFF6D6"/>
    </g>
  </g>
</svg>
