<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Helios listening">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#FFC14A"/>
      <stop offset="100%" stop-color="#E07800"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#FFB020" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse { transform-origin: 64px 64px; animation: pulse 1.1s ease-in-out infinite; }
      .blink { animation: blink 2.2s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes blink {
        0%, 70%, 100% { transform: scaleY(1); }
        78% { transform: scaleY(0.1); }
      }
    </style>
  </defs>
  <circle class="pulse" cx="64" cy="64" r="58" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="34" fill="url(#core)"/>
  <g fill="#1A1208">
    <g class="blink" style="transform-origin: 52px 60px">
      <ellipse cx="52" cy="60" rx="7.5" ry="8.5"/>
      <circle cx="54" cy="58" r="2.4" fill="#FFF6D6"/>
    </g>
    <g class="blink" style="transform-origin: 76px 60px; animation-delay: 0.05s">
      <ellipse cx="76" cy="60" rx="7.5" ry="8.5"/>
      <circle cx="78" cy="58" r="2.4" fill="#FFF6D6"/>
    </g>
  </g>
</svg>
