<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ada idle calm">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#3A1F6E"/>
